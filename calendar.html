<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оқу күнтізбесі - Ануар Төле</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col min-h-screen relative">
    
    <!-- Навигация -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <span class="font-bold text-xl text-blue-400">AT.</span>
                </div>
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white px-3 py-2 transition">Басты бет</a>
                    <a href="blog.html" class="text-gray-300 hover:text-white px-3 py-2 transition">Блог</a>
                    <a href="portfolio.html" class="text-gray-300 hover:text-white px-3 py-2 transition">Портфолио</a>
                    <a href="calendar.html" class="text-blue-400 font-medium px-3 py-2">Күнтізбе</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- Күнтізбе тақырыбы мен басқару панелі (Жоғарыда орналасқан) -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 border-b border-gray-700 pb-4 gap-4">
            <div>
                <h2 class="text-3xl font-bold text-white">Интерактивті Күнтізбе</h2>
                <p class="text-gray-400 mt-2">2026-2027 оқу жылы (Жеке тапсырма)</p>
            </div>
            
            <!-- Айды ауыстыру басқару панелі -->
            <div class="flex items-center gap-4 bg-gray-800 p-2 rounded-lg border border-gray-700">
                <button id="prev-month" class="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded transition">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div id="current-month-display" class="text-white font-semibold min-w-[140px] text-center">
                    <!-- JavaScript осы жерге айдың атын жазады -->
                </div>
                <button id="next-month" class="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded transition">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
        
        <!-- Күнтізбе торы -->
        <div class="calendar-wrapper bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <!-- Апта күндерінің тақырыптары -->
            <div class="grid grid-cols-7 gap-1 mb-1">
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm rounded-tl-lg">Дүй</div>
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm">Сей</div>
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm">Сәр</div>
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm">Бей</div>
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm">Жұм</div>
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm">Сен</div>
                <div class="bg-gray-900 text-gray-400 text-center py-2 font-semibold text-sm rounded-tr-lg">Жек</div>
            </div>
            
            <!-- Күндер салынатын негізгі тор (Grid) -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 bg-gray-700 border border-gray-700 rounded-b-lg overflow-hidden"></div>
        </div>
    </main>

    <!-- Modal (Сабақ жоспарын жазу терезесі) -->
    <div id="plan-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 px-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-lg border border-gray-600 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white" id="modal-date-str">Күн</h3>
                <button id="close-modal" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <textarea id="plan-textarea" class="w-full h-40 bg-gray-900 text-gray-200 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 mb-4 placeholder-gray-500" placeholder="Осы күнге сабақ жоспарын немесе тақырыбын жазыңыз..."></textarea>
            <div class="flex flex-col sm:flex-row gap-3 justify-between">
                <button id="generate-ai-plan" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center justify-center">
                    <i class="fas fa-magic mr-2"></i> AI жоспар құру
                </button>
                <button id="save-plan" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">Сақтау</button>
            </div>
        </div>
    </div>

    <footer class="bg-gray-800 border-t border-gray-700 py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-gray-400 text-sm">
            &copy; 2026 Ануар Төле. Барлық құқықтар қорғалған.
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
